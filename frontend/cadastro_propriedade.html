<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AgroRisk | Nova Propriedade</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- Leaflet Draw -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="property-body">

    <div class="property-header">

        <div class="container">

            <div class="header-content">

                <div>

                    <h1>
                        <i class="fa-solid fa-map-location-dot"></i>
                        Nova Propriedade
                    </h1>

                    <p>
                        Cadastre sua fazenda e delimite sua área para iniciar o
                        monitoramento inteligente da produção.
                    </p>

                </div>

                <a href="dashboard.html" class="btn-voltar">

                    <i class="fa-solid fa-arrow-left"></i>

                    Dashboard

                </a>

            </div>

        </div>

    </div>

    <section class="property-page">

        <div class="container">

            <div class="row g-4">

                <!-- MAPA -->

                <div class="col-lg-8">

                    <div class="map-card">

                        <div class="map-top">

                            <div>

                                <h3>

                                    <i class="fa-solid fa-earth-americas"></i>

                                    Delimite sua propriedade

                                </h3>

                                <span>

                                    Desenhe os limites da fazenda diretamente no mapa.

                                </span>

                            </div>

                            <button class="btn-search" id="btnPesquisar">

                                <i class="fa-solid fa-magnifying-glass-location"></i>

                                Pesquisar Local

                            </button>

                        </div>

                        <div id="map"></div>

                    </div>

                </div>

                <!-- PAINEL LATERAL -->

                <div class="col-lg-4">

                    <div class="side-panel">

                        <h3>

                            <i class="fa-solid fa-tractor"></i>

                            Informações

                        </h3>

                        <form id="formPropriedade">

                            <div class="mb-3">

                                <label>

                                    Nome da propriedade

                                </label>

                                <input type="text" id="nome" class="form-control" placeholder="Ex.: Fazenda Boa Vista">

                            </div>

                            <div class="mb-3">

                                <label>

                                    Estado

                                </label>

                                <input type="text" id="estado" class="form-control">

                            </div>

                            <div class="mb-3">

                                <label>

                                    Cidade

                                </label>

                                <input type="text" id="cidade" class="form-control">

                            </div>



                            <div class="mb-4">

                                <label>

                                    Observações

                                </label>

                                <textarea rows="4" id="observacao" class="form-control"
                                    placeholder="Escreva alguma observação..."></textarea>

                            </div>

                        </form>

                        <div class="info-cards">

                            <div class="mini-card">

                                <i class="fa-solid fa-vector-square"></i>

                                <h5>Área</h5>

                                <span id="area">

                                    Ainda não calculada

                                </span>

                            </div>

                            <div class="mini-card">

                                <i class="fa-solid fa-ruler-combined"></i>

                                <h5>Perímetro</h5>

                                <span id="perimetro">

                                    Ainda não calculado

                                </span>

                            </div>

                        </div>

                        

                        <div class="buttons">

                            <button type="button" id="limparMapa" class="btn-clear">

                                <i class="fa-solid fa-trash"></i>

                                Limpar

                            </button>

                            <button type="button" id="salvar" class="btn-save">

                                <i class="fa-solid fa-floppy-disk"></i>

                                Salvar Propriedade

                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

    <script src="js/api.js"></script>

    <script src="js/cadastroPropriedade.js"></script>

</body>

</html>
